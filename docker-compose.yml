services:
  db:
    image: postgres:16-alpine
    container_name: harjoitustyo-db
    environment:
      POSTGRES_DB: harjoitustyo
      POSTGRES_USER: harjoitus
      POSTGRES_PASSWORD: harjoitus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: harjoitustyo-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/harjoitustyo
      SPRING_DATASOURCE_USERNAME: harjoitus
      SPRING_DATASOURCE_PASSWORD: harjoitus
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      APP_BASE_URL: http://localhost:8080
      APP_ADMIN_EMAIL: admin@example.com
    volumes:
      - app-uploads:/app/uploads

volumes:
  postgres-data:
  app-uploads:
