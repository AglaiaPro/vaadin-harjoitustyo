spring.application.name=vaadin-harjoitustyo
server.port=${PORT:8080}
spring.config.import=optional:file:./config/oauth.properties

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/harjoitustyo;AUTO_SERVER=TRUE;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

vaadin.launch-browser=false
vaadin.allowed-packages=com.example.harjoitustyo

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.admin-email=${APP_ADMIN_EMAIL:admin@example.com}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Optional OAuth2. Put local values into ./config/oauth.properties.

# Optional SMTP. Without these values, email actions are logged and shown in the UI.
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=user@example.com
